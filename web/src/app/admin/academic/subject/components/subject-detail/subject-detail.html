<section class="flex flex-col h-full p-3">
  <div class="shrink-0 space-y-1 p-4">
    <h1 class="text-lg font-semibold tracking-tight md:text-xl">Medium of Instruction Detail</h1>

    <p class="text-sm text-gray-600">View and edit this medium of instruction.</p>
  </div>

  <div class="flex-1 overflow-y-auto space-y-6 p-4">
    <div>
      <app-subject-form [subject]="subject()" [mediaOptions]="mediaOptions()" />
    </div>

    <div>
      <mat-divider></mat-divider>
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
      <div class="rounded-lg border border-blue-200 bg-blue-50/60 p-3 text-xs">
        <div class="flex items-center gap-2">
          <mat-icon class="text-blue-600">calendar_today</mat-icon>
          <span class="font-medium tracking-wide text-blue-700"> Created At </span>
        </div>

        <p class="ms-8 font-medium text-blue-950">
          {{ subject()?.createdAt | date: 'mediumDate' }}
        </p>
      </div>

      <div class="rounded-lg border border-violet-200 bg-violet-50/60 p-3 text-xs">
        <div class="flex items-center gap-2">
          <mat-icon class="text-violet-600">update</mat-icon>
          <span class="font-medium tracking-wide text-violet-700"> Last Updated </span>
        </div>

        <p class="ms-8 font-medium text-violet-950">
          {{ subject()?.updatedAt | date: 'mediumDate' }}
        </p>
      </div>
    </div>
  </div>
</section>
