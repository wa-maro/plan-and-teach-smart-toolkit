<section class="w-full overflow-x-auto rounded-lg border border-gray-200 bg-white">
  <table mat-table [dataSource]="subjects()" class="min-w-160 w-full text-sm md:text-base">
    <ng-container matColumnDef="index">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let subject; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let subject">{{ subject.name }}</td>
    </ng-container>

    <ng-container matColumnDef="mediumOfInstruction">
      <th mat-header-cell *matHeaderCellDef>Medium of instruction</th>
      <td mat-cell *matCellDef="let subject">
        {{ subject.mediumOfInstruction.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef>Last update</th>
      <td mat-cell *matCellDef="let subject">{{ subject.updatedAt | date: 'mediumDate' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let subject">
        <app-delete-item-action [item]="subject" (deleteItem)="onDelete(subject)" />
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="displayedColumns.length">No data available.</td>
    </tr>
  </table>
</section>
