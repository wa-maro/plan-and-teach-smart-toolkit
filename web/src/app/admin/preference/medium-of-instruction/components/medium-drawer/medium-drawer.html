<app-drawer-component [(opened)]="opened" (openedChange)="onDrawerStateChange($event)">
  <div drawer-side-panel>
    @switch (mode()) {
      @case ('create') {
        <app-create-medium-form />
      }

      @case ('show') {
        @if (selectedMedium(); as medium) {
          <app-medium-detail [selectedMedium]="medium" />
        }
      }
    }
  </div>

  <div drawer-main-content>
    <ng-content />
  </div>
</app-drawer-component>
