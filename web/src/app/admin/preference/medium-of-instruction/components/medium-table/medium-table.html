<app-table-component
  [dataSource]="media()"
  [displayedColumns]="displayedColumns"
  (selectedRow)="onSelect($event)"
>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Name</th>
    <td mat-cell *matCellDef="let medium">{{ medium.name }}</td>
  </ng-container>

  <ng-container matColumnDef="updatedAt">
    <th mat-header-cell *matHeaderCellDef>Last update</th>
    <td mat-cell *matCellDef="let medium">{{ medium.updatedAt | date: 'mediumDate' }}</td>
  </ng-container>
</app-table-component>
