<app-medium-drawer [(opened)]="drawerOpened" #mediumDrawer>
  <div class="space-y-6 px-4 py-5 md:px-6">
    <section class="flex items-center justify-between gap-4">
      <div class="flex-1 space-y-1">
        <h1 class="text-xl md:text-2xl font-semibold tracking-tight">Medium of Instructions</h1>

        <p class="text-sm text-gray-600">
          A list of all languages used as a medium of instruction.
        </p>
      </div>

      <div>
        <button
          mat-flat-button
          color="primary"
          class="min-w-0! px-3! sm:px-4! rounded-full"
          (click)="mediumDrawer.openCreate()"
        >
          <mat-icon class="m-0!">add</mat-icon>

          <span class="hidden sm:inline sm:ml-2">Add Language</span>
        </button>
      </div>
    </section>

    @if (loading()) {
      <div class="flex items-center justify-center">
        <mat-progress-spinner mode="indeterminate" />
      </div>
    } @else {
      <app-medium-table [media]="media()" (selectedMedium)="getSelectedMedium($event)" />
    }
  </div>
</app-medium-drawer>
