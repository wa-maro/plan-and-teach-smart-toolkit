<a
  mat-list-item
  [routerLink]="navLink().url"
  routerLinkActive="bg-slate-100 text-blue-600"
  [routerLinkActiveOptions]="{ exact: true }"
  ariaCurrentWhenActive="page"
  class="flex w-full items-center gap-3 rounded-lg border border-transparent px-3 py-2.5 font-medium transition-colors hover:bg-slate-100 hover:border-slate-200"
>
  @if (navLink().icon) {
    <mat-icon matListItemIcon>{{ navLink().icon }}</mat-icon>
  }

  <span matListItemTitle>{{ navLink().title }}</span>
</a>
